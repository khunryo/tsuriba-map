<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サポート｜潮先</title><style>body{margin:0;background:#07131f;color:#dcecef;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.7}main{max-width:680px;margin:auto;padding:40px 22px 80px}h1{color:#fff}label{display:block;margin:18px 0 6px;font-weight:700}input,textarea,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #315269;border-radius:10px;background:#0d2131;color:#fff;font:inherit}textarea{min-height:150px}button{margin-top:20px;padding:13px 22px;border:0;border-radius:10px;background:#64e4d2;color:#06202a;font-weight:800}a{color:#64e4d2}.note{color:#94adb5}</style></head><body><main><h1>潮先サポート</h1><p>不具合、掲載情報、投稿削除、プライバシーに関するお問い合わせを受け付けます。</p><form id="supportForm"><label for="kind">お問い合わせ種別</label><select id="kind" name="kind"><option>不具合</option><option>掲載情報</option><option>投稿削除</option><option>プライバシー</option><option>その他</option></select><label for="reply">返信先メールアドレス（任意）</label><input id="reply" name="reply" type="email" maxlength="160"><label for="message">内容</label><textarea id="message" name="message" maxlength="2000" required></textarea><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><button type="submit">送信する</button><p id="result" class="note" role="status"></p></form><p><a href="/">潮先へ戻る</a>　<a href="/privacy.html">プライバシーポリシー</a>　<a href="/terms.html">利用規約</a></p></main><script>document.getElementById('supportForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),r=document.getElementById('result');b.disabled=true;r.textContent='送信しています…';try{const res=await fetch('/api/support',{method:'POST',body:new FormData(e.currentTarget)});if(!res.ok)throw new Error();e.currentTarget.reset();r.textContent='お問い合わせを受け付けました。';}catch(_){r.textContent='送信できませんでした。時間をおいて再度お試しください。';}finally{b.disabled=false;}});</script></body></html>
