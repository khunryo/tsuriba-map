<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17252b">
  <meta name="description" content="出発前の持ち物を端末内だけで確認するチェックリスト">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>忘れ物チェック</title>
  <style>
    :root {
      --ink: #17252b;
      --muted: #718087;
      --paper: #f5f2e9;
      --card: #fffdf8;
      --line: #e8e3d6;
      --accent: #d5ee4e;
      --accent-deep: #9daf22;
      --warm: #f2c68e;
      --shadow: 0 18px 50px rgba(23, 37, 43, .10);
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(100%, 680px); margin: 0 auto; padding: 22px 18px 36px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .02em; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: var(--accent); font-size: 18px; transform: rotate(-7deg); }
    .privacy { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 5px; }
    .privacy-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-deep); }
    .hero { margin-bottom: 26px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent-deep); font-size: 12px; font-weight: 800; letter-spacing: .11em; }
    h1 { margin: 0; font-size: clamp(30px, 8vw, 46px); line-height: 1.12; letter-spacing: -.055em; }
    .lede { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .progress-card { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 20px; margin-bottom: 24px; border-radius: 24px; background: var(--ink); color: #fdfbf3; box-shadow: var(--shadow); }
    .progress-card::after { content: ""; position: absolute; width: 140px; height: 140px; right: -45px; top: -70px; border-radius: 50%; background: rgba(213, 238, 78, .16); }
    .progress-kicker { position: relative; z-index: 1; color: #aebdc0; font-size: 12px; }
    .progress-title { position: relative; z-index: 1; margin-top: 2px; font-size: 19px; font-weight: 800; }
    .progress-bar { width: 100%; height: 8px; margin-top: 14px; border-radius: 99px; background: #35454a; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
    .progress-number { position: relative; z-index: 1; min-width: 68px; text-align: right; font-size: 31px; font-weight: 800; letter-spacing: -.06em; }
    .progress-number small { display: block; color: #aebdc0; font-size: 11px; font-weight: 600; letter-spacing: 0; }
    .section-label { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 10px; }
    .section-label h2 { margin: 0; font-size: 14px; letter-spacing: .02em; }
    .text-button { border: 0; padding: 4px 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
    .text-button:hover, .text-button:focus-visible { color: var(--ink); }
    .templates { display: flex; gap: 8px; overflow-x: auto; padding: 2px 1px 5px; margin: 0 -1px 24px; scrollbar-width: none; }
    .templates::-webkit-scrollbar { display: none; }
    .template { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 99px; background: rgba(255, 253, 248, .65); cursor: pointer; font-size: 12px; font-weight: 700; transition: border-color .2s, background .2s, transform .2s; }
    .template:hover, .template:focus-visible { border-color: var(--accent-deep); transform: translateY(-1px); }
    .template.active { border-color: var(--ink); background: var(--ink); color: #fffdf8; }
    .list { display: grid; gap: 9px; }
    .item { display: grid; grid-template-columns: 34px 1fr 30px; align-items: center; gap: 11px; min-height: 64px; padding: 10px 12px 10px 10px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); transition: opacity .2s, transform .2s, border-color .2s; }
    .item:hover { border-color: #d8d0bf; }
    .item.checked { background: #eef1de; border-color: #dfe5bb; }
    .check { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 2px solid #c9d0c8; border-radius: 12px; background: transparent; cursor: pointer; transition: background .2s, border-color .2s, transform .15s; }
    .check:active { transform: scale(.9); }
    .check::after { content: ""; width: 8px; height: 14px; border: solid var(--ink); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -2px) scale(0); transition: transform .18s; }
    .item.checked .check { border-color: var(--accent); background: var(--accent); }
    .item.checked .check::after { transform: rotate(45deg) translate(-1px, -2px) scale(1); }
    .item-name { min-width: 0; overflow-wrap: anywhere; font-size: 14px; font-weight: 700; }
    .item.checked .item-name { color: #758078; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .item-category { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .delete { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #a8b0ad; cursor: pointer; font-size: 19px; line-height: 1; }
    .delete:hover, .delete:focus-visible { background: #f2e9dd; color: #a56c59; }
    .add-card { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px; margin-top: 18px; border: 1px dashed #cfc8b8; border-radius: 18px; background: rgba(255, 253, 248, .45); }
    .add-card input { min-width: 0; padding: 9px 10px; border: 0; outline: none; background: transparent; color: var(--ink); font-size: 14px; }
    .add-card input::placeholder { color: #9ba5a2; }
    .primary { padding: 10px 15px; border: 0; border-radius: 13px; background: var(--ink); color: #fffdf8; cursor: pointer; font-size: 12px; font-weight: 800; }
    .primary:hover, .primary:focus-visible { background: #2b4148; }
    .bottom-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; }
    .ghost { padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px; background: transparent; cursor: pointer; font-size: 12px; font-weight: 700; }
    .ghost:hover, .ghost:focus-visible { border-color: #b7ad99; background: rgba(255, 253, 248, .65); }
    .saved { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .saved-icon { color: var(--accent-deep); font-size: 13px; }
    .empty { padding: 28px 18px; border: 1px dashed #d7d0c1; border-radius: 18px; color: var(--muted); text-align: center; font-size: 13px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (min-width: 620px) { .shell { padding-top: 38px; } .topbar { margin-bottom: 52px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span><span>忘れ物チェック</span></div>
      <div class="privacy"><span class="privacy-dot" aria-hidden="true"></span>端末内に保存</div>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">BEFORE YOU GO</p>
      <h1 id="page-title">忘れ物、<br>出発前にひとつずつ。</h1>
      <p class="lede">持ち物をそろえて、気持ちよく出かけよう。</p>
    </section>

    <section class="progress-card" aria-live="polite">
      <div>
        <div class="progress-kicker">今日のチェック状況</div>
        <div class="progress-title" id="progress-title">まずは確認をはじめよう</div>
        <div class="progress-bar" role="progressbar" aria-label="チェック進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="progress-number"><span id="checked-count">0</span><small>/<span id="total-count">0</span> items</small></div>
    </section>

    <section aria-labelledby="template-title">
      <div class="section-label"><h2 id="template-title">テンプレートから始める</h2></div>
      <div class="templates" role="list">
        <button class="template active" type="button" data-template="fishing">🎣 釣り</button>
        <button class="template" type="button" data-template="outing">☀️ おでかけ</button>
        <button class="template" type="button" data-template="work">💼 仕事</button>
      </div>
    </section>

    <section aria-labelledby="list-title">
      <div class="section-label"><h2 id="list-title">持ち物リスト</h2><button class="text-button" id="hide-completed" type="button" aria-pressed="false">完了を隠す</button></div>
      <div class="list" id="list"></div>
      <form class="add-card" id="add-form">
        <label class="sr-only" for="new-item">持ち物を追加</label>
        <input id="new-item" name="item" type="text" maxlength="40" placeholder="持ち物を追加…" autocomplete="off">
        <button class="primary" type="submit">追加</button>
      </form>
    </section>

    <div class="bottom-actions">
      <div class="saved"><span class="saved-icon">●</span><span id="save-note">この端末に保存しています</span></div>
      <button class="ghost" id="reset" type="button">チェックをリセット</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'forget-check:list:v1';
    const templates = {
      fishing: [
        ['釣り道具', 'ロッド・リール'], ['釣り道具', '仕掛け・ルアー'], ['釣り道具', 'エサ・小物ケース'],
        ['安全・快適', 'ライフジャケット'], ['安全・快適', '帽子・日焼け止め'], ['安全・快適', '飲み物'],
        ['貴重品', '財布・スマートフォン'], ['貴重品', '車の鍵']
      ],
      outing: [
        ['貴重品', '財布・スマートフォン'], ['貴重品', '家の鍵'], ['おでかけ', 'ハンカチ・ティッシュ'],
        ['おでかけ', 'モバイルバッテリー'], ['おでかけ', '飲み物'], ['おでかけ', '折りたたみ傘']
      ],
      work: [
        ['仕事道具', 'PC・タブレット'], ['仕事道具', '充電器'], ['仕事道具', 'ノート・ペン'],
        ['貴重品', '社員証'], ['貴重品', '財布・スマートフォン'], ['身だしなみ', 'ハンカチ']
      ]
    };
    const els = {
      list: document.querySelector('#list'), form: document.querySelector('#add-form'), input: document.querySelector('#new-item'),
      checked: document.querySelector('#checked-count'), total: document.querySelector('#total-count'), fill: document.querySelector('#progress-fill'),
      progressTitle: document.querySelector('#progress-title'), progressBar: document.querySelector('[role=progressbar]'), reset: document.querySelector('#reset'),
      hide: document.querySelector('#hide-completed'), note: document.querySelector('#save-note')
    };
    let state = loadState();
    let hideCompleted = false;

    function makeItems(key) {
      return templates[key].map(([category, name], index) => ({ id: `${key}-${Date.now()}-${index}`, category, name, checked: false }));
    }
    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(parsed) && parsed.every((item) => item && item.id && item.name)) return parsed;
      } catch (_) { /* use the default list */ }
      return makeItems('fishing');
    }
    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); els.note.textContent = 'この端末に保存しています'; }
      catch (_) { els.note.textContent = '保存できませんでした'; }
    }
    function render() {
      const visible = hideCompleted ? state.filter((item) => !item.checked) : state;
      els.list.innerHTML = '';
      if (!visible.length) {
        const empty = document.createElement('div'); empty.className = 'empty';
        empty.textContent = state.length && hideCompleted ? 'チェック済みです。ひと休みして大丈夫。' : '持ち物がありません。下から追加できます。';
        els.list.append(empty);
      }
      visible.forEach((item) => {
        const row = document.createElement('div'); row.className = `item${item.checked ? ' checked' : ''}`; row.dataset.id = item.id;
        const check = document.createElement('button'); check.className = 'check'; check.type = 'button'; check.setAttribute('aria-label', `${item.name}を${item.checked ? '未チェックに戻す' : 'チェックする'}`); check.setAttribute('aria-pressed', String(item.checked));
        check.addEventListener('click', () => { item.checked = !item.checked; saveState(); render(); });
        const copy = document.createElement('div'); const name = document.createElement('div'); name.className = 'item-name'; name.textContent = item.name; const category = document.createElement('div'); category.className = 'item-category'; category.textContent = item.category; copy.append(name, category);
        const del = document.createElement('button'); del.className = 'delete'; del.type = 'button'; del.setAttribute('aria-label', `${item.name}を削除`); del.textContent = '×';
        del.addEventListener('click', () => { state = state.filter((candidate) => candidate.id !== item.id); saveState(); render(); });
        row.append(check, copy, del); els.list.append(row);
      });
      const checked = state.filter((item) => item.checked).length; const total = state.length; const percent = total ? Math.round(checked / total * 100) : 0;
      els.checked.textContent = checked; els.total.textContent = total; els.fill.style.width = `${percent}%`; els.progressBar.setAttribute('aria-valuenow', String(percent));
      els.progressTitle.textContent = total && checked === total ? '準備ばっちり。いってらっしゃい！' : checked ? `${total - checked}個、あと少し` : 'まずは確認をはじめよう';
      els.hide.textContent = hideCompleted ? 'すべて表示' : '完了を隠す'; els.hide.setAttribute('aria-pressed', String(hideCompleted));
    }
    document.querySelectorAll('[data-template]').forEach((button) => button.addEventListener('click', () => {
      const key = button.dataset.template; state = makeItems(key); hideCompleted = false;
      document.querySelectorAll('[data-template]').forEach((candidate) => candidate.classList.toggle('active', candidate === button));
      saveState(); render();
    }));
    els.form.addEventListener('submit', (event) => {
      event.preventDefault(); const name = els.input.value.trim(); if (!name) { els.input.focus(); return; }
      if (state.some((item) => item.name === name)) { els.note.textContent = '同じ項目がすでにあります'; els.input.select(); return; }
      state.push({ id: `custom-${Date.now()}`, category: '追加した項目', name, checked: false }); els.input.value = ''; saveState(); render(); els.input.focus();
    });
    els.hide.addEventListener('click', () => { hideCompleted = !hideCompleted; render(); });
    els.reset.addEventListener('click', () => { state.forEach((item) => { item.checked = false; }); hideCompleted = false; saveState(); render(); });
    render();
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  </script>
</body>
</html>
