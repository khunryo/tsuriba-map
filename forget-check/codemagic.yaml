workflows:
  ios-debug-unsigned:
    name: Forget Check iOS / Unsigned debug IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'forget-check-ios-build-*'
          include: true

    environment:
      xcode: 26.4
      node: 22.14.0
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Install JavaScript dependencies
        script: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build web app and sync Capacitor
        script: pnpm run ios:sync

      - name: Build unsigned app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA for Sideloadly
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/derived/Build/Products/Release-iphoneos/App.app"
          OUT_DIR="$CM_BUILD_DIR/build/ios/ipa"
          test -d "$APP_PATH"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR/Payload"
          cp -R "$APP_PATH" "$OUT_DIR/Payload/ForgetCheck.app"
          cd "$OUT_DIR"
          zip -qry "ForgetCheck-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "$OUT_DIR"

      - name: Capture a genuine 13-inch iPad screenshot
        script: |
          FORGET_CHECK_SIM_UDID="$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);const devices=Object.values(j.devices).flat();const device=devices.find(d=>d.isAvailable && d.name.includes("iPad Pro 13-inch"));if(!device){console.error("No available iPad Pro 13-inch simulator was found");process.exit(2)}process.stdout.write(device.udid)})')"
          echo "Using simulator $FORGET_CHECK_SIM_UDID"
          xcrun simctl boot "$FORGET_CHECK_SIM_UDID" || true
          xcrun simctl bootstatus "$FORGET_CHECK_SIM_UDID" -b
          xcrun simctl spawn "$FORGET_CHECK_SIM_UDID" defaults write NSGlobalDomain AppleLanguages -array en
          xcrun simctl spawn "$FORGET_CHECK_SIM_UDID" defaults write NSGlobalDomain AppleLocale en_US
          xcrun simctl status_bar "$FORGET_CHECK_SIM_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$FORGET_CHECK_SIM_UDID" \
            -derivedDataPath "$CM_BUILD_DIR/build/ios/simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

          FORGET_CHECK_SIM_APP="$CM_BUILD_DIR/build/ios/simulator/Build/Products/Release-iphonesimulator/App.app"
          test -d "$FORGET_CHECK_SIM_APP"
          xcrun simctl install "$FORGET_CHECK_SIM_UDID" "$FORGET_CHECK_SIM_APP"
          xcrun simctl launch "$FORGET_CHECK_SIM_UDID" jp.khunryo.forgetcheck
          sleep 8

          mkdir -p "$CM_BUILD_DIR/build/ios/screenshots"
          xcrun simctl io "$FORGET_CHECK_SIM_UDID" screenshot --type=png \
            "$CM_BUILD_DIR/build/ios/screenshots/ForgetCheck_iPad_13inch_CategorySelection.png"
          sips -g pixelWidth -g pixelHeight \
            "$CM_BUILD_DIR/build/ios/screenshots/ForgetCheck_iPad_13inch_CategorySelection.png"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/screenshots/*.png
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: Forget Check iOS / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 26.4
      node: 22.14.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.khunryo.forgetcheck
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Install JavaScript dependencies
        script: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build web app and sync Capacitor
        script: pnpm run ios:sync

      - name: Apply App Store signing profiles
        script: xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
