workflows:
  ios-testflight:
    name: Shiome iOS / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: shiome-app-store-connect

    environment:
      xcode: 26.4
      node: 22.14.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.khunryo.shiome
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Build web app and sync Capacitor
        script: npm run ios:sync

      - name: Apply App Store signing profiles
        script: xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
