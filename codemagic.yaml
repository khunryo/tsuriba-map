workflows:
  android-debug:
    name: Shiome Android / Debug APK
    instance_type: linux_x2
    max_build_duration: 60

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'android-build-*'
          include: true

    environment:
      node: 22.14.0
      java: 21

    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Build web app and sync Capacitor
        script: npm run android:sync

      - name: Build Android debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/reports/**

  ios-testflight:
    name: Shiome iOS / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-build-*'
          include: true

    integrations:
      app_store_connect: CodemagicASCKey

    environment:
      xcode: 26.4
      node: 22.14.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.khunryo.shiome
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Build web app and sync Capacitor
        script: npm run ios:sync

      - name: Apply App Store signing profiles
        script: xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  ios-debug-unsigned:
    name: Shiome iOS / Unsigned debug build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 26.4
      node: 22.14.0
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Build web app and sync Capacitor
        script: npm run ios:sync

      - name: Show synced web assets
        script: |
          ls -la "$CM_BUILD_DIR/www"
          ls -la "$CM_BUILD_DIR/ios/App/App/public" || true

      - name: Build unsigned app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/derived/Build/Products/Release-iphoneos/App.app"
          OUT_DIR="$CM_BUILD_DIR/build/ios/ipa"
          test -d "$APP_PATH"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR/Payload"
          cp -R "$APP_PATH" "$OUT_DIR/Payload/App.app"
          cd "$OUT_DIR"
          zip -qry "Shiome-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "$OUT_DIR"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
